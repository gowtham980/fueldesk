[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fueldesk"
version = "0.3.1"
description = "Local-first Personal Fuel & Training Protocol Desk — diet + exercise plans from your body stats."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fueldesk contributors" }]
keywords = ["fitness", "nutrition", "training", "tdee", "macros", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
adk = [
  "google-adk[extensions]>=1.0",
]
dev = [
  "pytest>=8.0",
  "pillow>=10.0",
]

[project.scripts]
fueldesk = "fueldesk.cli:main"

[project.urls]
Homepage = "https://github.com/gowtham980/fueldesk"
Repository = "https://github.com/gowtham980/fueldesk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fueldesk = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
